name: blocwithcleanarch
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  get_it: ^7.6.0

  firebase_core: ^4.6.0
  firebase_auth: ^6.4.0
  firebase_database: ^12.2.0

  # Permission handling
  permission_handler: ^11.3.1

  # Image / Photo zoom (replaces PhotoView library)
  photo_view: ^0.15.0

  # Image caching (replaces Glide / UniversalImageLoader)
  cached_network_image: ^3.3.1

  # Image gallery saver (replaces Android save-to-gallery)
  image_gallery_saver: ^2.0.3

  # Share (replaces Android share intent)
  share_plus: ^12.0.2

  # Path provider (for save to local storage)
  path_provider: ^2.1.2

  # Responsive sizing (replaces sdp-android / ssp-android)
  flutter_screenutil: ^5.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/SecretGarden/